plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // JEI repo
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    // Pixelmon repo
    ivy {
        setUrl('https://download.nodecdn.net/containers/reforged/universal/release')

        metadataSources {
            artifact()
            gradleMetadata()
        }
        patternLayout {
            artifact('[artifact].[ext]')
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets {
    main {
        java {
            include 'com/duckfox/jep/JustEnoughPixelmon.java'
            include 'com/duckfox/jep/plugin/JEPPlugin.java'
            include 'com/duckfox/jep/plugin/DuckRecipeCategory.java'
            include 'com/duckfox/jep/plugin/pokemon/PokeDropRecipeCategory.java'
            include 'com/duckfox/jep/plugin/pokemon/PokeDropRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/pokemon/PokeHeldRecipeCategory.java'
            include 'com/duckfox/jep/plugin/pokemon/PokeHeldRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/boss/BossDropRecipeCategory.java'
            include 'com/duckfox/jep/plugin/boss/BossDropRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/den/RaidDropRecipeCategory.java'
            include 'com/duckfox/jep/plugin/den/RaidDropRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/fishing/FishingRecipeCategory.java'
            include 'com/duckfox/jep/plugin/fishing/FishingRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/infuser/InfuserRecipeCategory.java'
            include 'com/duckfox/jep/plugin/infuser/InfuserRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/moveskill/MoveSkillRecipeCategory.java'
            include 'com/duckfox/jep/plugin/moveskill/MoveSkillRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/moveskill/HeadbuttRecipeCategory.java'
            include 'com/duckfox/jep/plugin/moveskill/HeadbuttRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/moveskill/ForageRecipeCategory.java'
            include 'com/duckfox/jep/plugin/moveskill/ForageRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/moveskill/RockSmashRecipeCategory.java'
            include 'com/duckfox/jep/plugin/moveskill/RockSmashRecipeWrapper.java'
            include 'com/duckfox/jep/plugin/shopkeepers/ShopKeepersRecipeCategory.java'
            include 'com/duckfox/jep/plugin/shopkeepers/ShopKeepersRecipeWrapper.java'
            include 'com/duckfox/jep/utils/Resources.java'
            include 'com/duckfox/jep/utils/Reflections.java'
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Pixelmon
    implementation("pixelmon:Pixelmon-${minecraft_version}-${pixelmon_version}-universal:${pixelmon_version}")
    interfaceInjectionData("pixelmon:Pixelmon-${minecraft_version}-${pixelmon_version}-universal-interfaceinjection:${pixelmon_version}@json")

    // JEI
    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pixelmon_version       : pixelmon_version,
            pixelmon_version_range : pixelmon_version_range,
            jei_version            : jei_version,
            jei_version_range      : jei_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
